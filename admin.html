<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>婚礼请帖 · 数据后台</title>
<style>
  :root{--champagne:#C9A86A;--champagne-deep:#A68A45;--ink:#4A3F33;--ink-soft:#8B7E6B;--ivory:#FBF6EC;--ivory-card:#FFFDF8;--blush-deep:#C98A86}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#FBF6EC,#F4ECDD);color:var(--ink);min-height:100vh;padding:28px 16px 60px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:1.35rem;letter-spacing:3px;text-align:center;color:var(--champagne-deep);margin-bottom:6px}
  .sub{text-align:center;font-size:.82rem;color:var(--ink-soft);margin-bottom:26px;letter-spacing:1px}
  .card{background:var(--ivory-card);border:1px solid rgba(201,168,106,.45);border-radius:14px;padding:22px;margin-bottom:22px;box-shadow:0 8px 22px rgba(75,63,54,.07)}
  h2{font-size:1rem;letter-spacing:2px;color:var(--champagne-deep);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  h2 .n{background:var(--champagne);color:#fff;font-size:.72rem;border-radius:999px;padding:1px 9px;font-weight:400}
  table{width:100%;border-collapse:collapse;font-size:.84rem}
  th{text-align:left;color:var(--ink-soft);font-weight:500;padding:7px 8px;border-bottom:1px solid rgba(201,168,106,.35);letter-spacing:1px}
  td{padding:8px;border-bottom:1px dashed rgba(201,168,106,.25);vertical-align:top;word-break:break-all}
  tr:last-child td{border-bottom:none}
  .empty{text-align:center;color:var(--ink-soft);padding:18px;font-size:.86rem;letter-spacing:1px}
  .bless-row{padding:10px 0;border-bottom:1px dashed rgba(201,168,106,.25)}
  .bless-row:last-child{border-bottom:none}
  .bless-row .who{font-weight:600;color:var(--champagne-deep);letter-spacing:1px}
  .bless-row .when{font-size:.74rem;color:var(--ink-soft);margin-left:8px}
  .bless-row .msg{margin-top:5px;color:var(--ink);line-height:1.6;font-size:.88rem}
  .login-box{max-width:340px;margin:60px auto 0;text-align:center}
  input[type=password]{width:100%;padding:13px 16px;border-radius:10px;border:1px solid rgba(201,168,106,.55);background:#fffdf8;font-size:1rem;outline:none;margin-bottom:14px}
  button{width:100%;padding:13px;border-radius:10px;border:1px solid var(--champagne);background:transparent;color:var(--champagne-deep);font-size:1rem;letter-spacing:3px;cursor:pointer;transition:background .3s,color .3s}
  button:hover{background:var(--champagne);color:#fff}
  .hint{font-size:.76rem;color:var(--ink-soft);margin-top:12px;letter-spacing:1px;line-height:1.8}
  .err{color:#c2564e;font-size:.82rem;margin-bottom:10px;display:none}
  .stat-row{display:flex;gap:12px;margin-bottom:16px}
  .stat{flex:1;background:linear-gradient(135deg,#FFFDF8,#F7EFDE);border:1px solid rgba(201,168,106,.45);border-radius:12px;padding:16px 10px;text-align:center;box-shadow:0 4px 12px rgba(75,63,54,.05)}
  .stat .num{font-family:Georgia,"Times New Roman",serif;font-size:1.7rem;font-weight:700;color:var(--champagne-deep)}
  .stat .lab{font-size:.74rem;color:var(--ink-soft);letter-spacing:2px;margin-top:4px}
  .toolbar{text-align:right;margin-bottom:14px}
  .toolbar a{font-size:.8rem;color:var(--champagne-deep);text-decoration:none;letter-spacing:1px;border:1px solid rgba(201,168,106,.55);padding:5px 14px;border-radius:999px;margin-left:8px;display:inline-block}
  .badge{font-size:.74rem;color:var(--ink-soft);letter-spacing:1px;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <h1>💒 婚礼请帖 · 数据后台</h1>
  <p class="sub">查看宾客出席回执与祝福留言（数据来自 LeanCloud 云端数据库）</p>

  <div class="login-box card" id="loginBox">
    <div class="err" id="err">密码不正确，请重试</div>
    <input type="password" id="pass" placeholder="请输入管理密码" autocomplete="off">
    <button id="loginBtn">进 入</button>
    <p class="hint">默认管理密码 <b>20261003</b>，可在本文件顶部 ADMIN_PASS 处修改</p>
  </div>

  <div id="panel" style="display:none">
    <div class="stat-row">
      <div class="stat"><div class="num" id="stRsvp">0</div><div class="lab">出席回执</div></div>
      <div class="stat"><div class="num" id="stGuests">0</div><div class="lab">预计出席人数</div></div>
      <div class="stat"><div class="num" id="stBless">0</div><div class="lab">祝福留言</div></div>
    </div>
    <div class="toolbar">
      <a href="#" id="refreshBtn">🔄 刷新数据</a>
      <a href="index.html" target="_blank">🎫 打开请帖</a>
    </div>
    <div class="card">
      <h2>出席回执 <span class="n" id="rsvpCount">0</span></h2>
      <div id="rsvpBox"><div class="empty">加载中…</div></div>
    </div>
    <div class="card">
      <h2>祝福留言 <span class="n" id="blessCount">0</span></h2>
      <div id="blessBox"><div class="empty">加载中…</div></div>
    </div>
    <p class="badge">数据同步自云端 · 宾客提交后此处即可看到 · 请勿把管理地址随意分享</p>
  </div>
</div>

<script>
/* ========== 配置：与 index.html 顶部的数据库凭证保持一致 ========== */
var LC_APP_ID  = '';   // ← 填入 App ID
var LC_APP_KEY = '';   // ← 填入 App Key
var LC_API     = '';   // ← 填入 API 服务器地址（形如 https://xxxx.cn-n1.leancloud.cn/1.1/）
var ADMIN_PASS = '20261003';

function $(s){return document.querySelector(s);}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function fmt(iso){try{var d=new Date(iso);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}catch(e){return '';}}
function dbReq(path){
  return fetch(LC_API+path,{
    headers:{'X-LC-Id':LC_APP_ID,'X-LC-Key':LC_APP_KEY,'Content-Type':'application/json'}
  }).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
}
function load(){
  var rsvpBox=$('#rsvpBox'),blessBox=$('#blessBox');
  rsvpBox.innerHTML='<div class="empty">加载中…</div>';
  blessBox.innerHTML='<div class="empty">加载中…</div>';
  dbReq('classes/WeddingRSVP?order=-createdAt&limit=500').then(function(d){
    var rows=d.results||[];
    $('#rsvpCount').textContent=rows.length;
    $('#stRsvp').textContent=rows.length;
    var guestsTotal=rows.reduce(function(s,r){return s+(parseInt(r.guests,10)||1);},0);
    $('#stGuests').textContent=guestsTotal;
    if(!rows.length){rsvpBox.innerHTML='<div class="empty">暂无回执，宾客提交后会自动出现在这里</div>';return;}
    rsvpBox.innerHTML='<table><tr><th>姓名</th><th>人数</th><th>电话</th><th>祝福</th><th>时间</th></tr>'+
      rows.map(function(r){
        return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.guests)+'</td><td>'+esc(r.phone)+'</td><td>'+(esc(r.bless)||'—')+'</td><td>'+fmt(r.createdAt)+'</td></tr>';
      }).join('')+'</table>';
  }).catch(function(){rsvpBox.innerHTML='<div class="empty">读取失败，请检查凭证配置或网络</div>';});

  dbReq('classes/WeddingBless?order=-createdAt&limit=200').then(function(d){
    var rows=d.results||[];
    $('#blessCount').textContent=rows.length;
    $('#stBless').textContent=rows.length;
    if(!rows.length){blessBox.innerHTML='<div class="empty">暂无祝福留言</div>';return;}
    blessBox.innerHTML=rows.map(function(r){
      return '<div class="bless-row"><span class="who">'+esc(r.name||r.who||'匿名')+'</span><span class="when">'+fmt(r.createdAt)+'</span><div class="msg">'+esc(r.msg)+'</div></div>';
    }).join('');
  }).catch(function(){blessBox.innerHTML='<div class="empty">读取失败，请检查凭证配置或网络</div>';});
}
$('#loginBtn').addEventListener('click',function(){
  var v=$('#pass').value.trim();
  if(v===ADMIN_PASS){
    $('#err').style.display='none';
    $('#loginBox').style.display='none';
    $('#panel').style.display='block';
    load();
  }else{
    $('#err').style.display='block';
  }
});
$('#pass').addEventListener('keydown',function(e){if(e.key==='Enter')$('#loginBtn').click();});
$('#refreshBtn').addEventListener('click',function(e){e.preventDefault();load();});
</script>
</body>
</html>
